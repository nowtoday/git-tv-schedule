name: Update weekly schedule

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-schedule.yml"
      - "scripts/**"
  schedule:
    - cron: "*/5 15 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: weekly-schedule-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Update to latest main
        run: git pull --rebase origin main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test schedule parser
        run: python -m unittest scripts.test_update_schedule
      - name: Fetch and update schedule
        run: python scripts/update_schedule.py
      - name: Commit schedule update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if git diff --cached --quiet; then
            echo "Schedule did not change."
          else
            git commit -m "Update weekly schedule"
            git push
          fi
