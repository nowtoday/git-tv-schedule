name: Update weekly schedule

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-schedule.yml"
      - "scripts/**"
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    - cron: "7-57/5 15 * * *"
  workflow_dispatch:

concurrency:
  group: weekly-schedule-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Log workflow trigger
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "schedule_cron=${SCHEDULE_CRON:-not-applicable}"
          echo "run_started_at_utc=$(date -u --iso-8601=seconds)"
          echo "run_started_at_kst=$(TZ=Asia/Seoul date --iso-8601=seconds)"
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Update to latest main
        run: git pull --rebase origin main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test schedule parser
        run: python -m unittest scripts.test_update_schedule
      - name: Fetch and update schedule
        run: python scripts/update_schedule.py
      - name: Commit schedule update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if git diff --cached --quiet; then
            echo "Schedule did not change."
          else
            git commit -m "Update weekly schedule"
            for attempt in 1 2 3; do
              git fetch origin main
              remote_main_before_push=$(git rev-parse origin/main)
              if ! git merge-base --is-ancestor origin/main HEAD; then
                if ! git rebase origin/main; then
                  git rebase --abort
                  echo "Could not rebase the schedule update onto the latest main." >&2
                  exit 1
                fi
              fi

              if git push origin HEAD:main; then
                exit 0
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 synchronized attempts." >&2
                exit 1
              fi

              git fetch origin main
              if [ "$(git rev-parse origin/main)" = "$remote_main_before_push" ]; then
                echo "Remote main did not advance; stopping instead of retrying a non-concurrency push failure." >&2
                exit 1
              fi
              echo "Remote main advanced during the push; syncing again for attempt $((attempt + 1))."
            done
          fi
