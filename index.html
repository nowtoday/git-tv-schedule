<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>요일별 편성표</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">MY TV GUIDE</p>
          <h1>요일별 편성표</h1>
          <p class="intro">Google Sheets에서 오늘 편성을 가져와 요일별로 모아보세요.</p>
        </div>
        <div class="import-actions">
          <button id="sheet-import-button" class="import-button sheet-import-button" type="button">Google Sheets 가져오기</button>
          <label class="import-button csv-import-button" for="csv-file">편성표 CSV 가져오기</label>
        </div>
        <input id="csv-file" type="file" accept=".csv,text/csv" hidden>
      </header>

      <section class="favorites-panel" aria-labelledby="favorites-heading">
        <div class="favorites-heading">
          <div>
            <h2 id="favorites-heading">즐겨찾는 프로그램</h2>
            <p>즐겨찾기는 이 브라우저의 쿠키에 저장되며, 등록하면 다음 방문부터 먼저 보여드려요.</p>
          </div>
          <div class="favorite-actions">
            <form id="favorite-form" class="favorite-form">
              <label class="sr-only" for="favorite-input">즐겨찾을 프로그램 이름</label>
              <input id="favorite-input" type="text" list="program-suggestions" placeholder="프로그램 이름 입력" maxlength="80" required>
              <datalist id="program-suggestions"></datalist>
              <button type="submit">추가</button>
            </form>
            <div class="backup-actions">
              <button id="schedule-backup-button" class="secondary-button" type="button">편성표 백업</button>
              <label class="secondary-button file-button" for="schedule-file">편성표 복원</label>
              <input id="schedule-file" type="file" accept=".json,application/json" hidden>
              <button id="backup-button" class="secondary-button" type="button">즐겨찾기 백업</button>
              <label class="secondary-button file-button" for="favorites-file">백업 불러오기</label>
              <input id="favorites-file" type="file" accept=".json,application/json" hidden>
            </div>
          </div>
        </div>
        <div id="favorite-list" class="favorite-list"></div>
      </section>

      <section class="toolbar" aria-label="편성표 필터">
        <div id="day-filters" class="filter-group" aria-label="요일"></div>
        <div class="toolbar-options">
          <div id="view-filters" class="filter-group" aria-label="표시 범위"></div>
          <div class="select-filters">
            <label>
              <span class="sr-only">장르</span>
              <select id="genre-filter">
                <option value="">모든 장르</option>
                <option value="미분류">미분류</option>
                <option value="예능">예능</option>
                <option value="교양/다큐">교양/다큐</option>
                <option value="드라마">드라마</option>
              </select>
            </label>
            <label>
              <span class="sr-only">채널</span>
              <select id="channel-filter">
                <option value="">모든 채널</option>
              </select>
            </label>
          </div>
        </div>
      </section>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <section id="schedule" class="schedule" aria-label="방송 편성표"></section>

      <footer>
        <p>Google Sheets 편성은 요일별로 저장되며, CSV 편성은 전체 편성을 교체합니다.</p>
        <button id="reset-button" class="text-button" type="button">오늘 편성 다시 가져오기</button>
      </footer>
    </main>
  </body>
</html>
