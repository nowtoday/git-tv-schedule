<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>요일별 편성표</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">MY TV GUIDE</p>
          <h1>요일별 편성표</h1>
          <p class="intro">자동으로 모은 주간 편성이나 지금 Google Sheets에서 가져온 편성을 확인해 보세요.</p>
        </div>
        <div class="import-actions">
          <button id="manual-sheet-refresh-button" class="import-button sheet-import-button" type="button">Google Sheets 수동 갱신</button>
          <button id="schedule-refresh-button" class="import-button sheet-import-button" type="button">저장된 편성 새로고침</button>
          <label class="import-button csv-import-button" for="csv-file">편성표 CSV 가져오기</label>
        </div>
        <input id="csv-file" type="file" accept=".csv,text/csv" hidden>
      </header>

      <section class="favorites-panel" aria-labelledby="favorites-heading">
        <div class="favorites-heading">
          <div>
            <h2 id="favorites-heading">즐겨찾는 프로그램</h2>
            <p>즐겨찾기는 이 브라우저에 저장되며, 등록하면 다음 방문부터 먼저 보여드려요.</p>
          </div>
          <div class="favorite-actions">
            <form id="favorite-form" class="favorite-form">
              <label class="sr-only" for="favorite-input">즐겨찾을 프로그램 이름</label>
              <input id="favorite-input" type="text" list="program-suggestions" placeholder="프로그램 이름 입력" maxlength="80" required>
              <datalist id="program-suggestions"></datalist>
              <button type="submit">추가</button>
            </form>
            <div class="backup-actions">
              <button id="schedule-backup-button" class="secondary-button" type="button">편성표 백업</button>
              <label class="secondary-button file-button" for="schedule-file">편성표 복원</label>
              <input id="schedule-file" type="file" accept=".json,application/json" hidden>
              <button id="backup-button" class="secondary-button" type="button">즐겨찾기 백업</button>
              <label class="secondary-button file-button" for="favorites-file">백업 불러오기</label>
              <input id="favorites-file" type="file" accept=".json,application/json" hidden>
            </div>
          </div>
        </div>
        <div id="favorite-list" class="favorite-list"></div>
        <button id="toggle-favorites" class="favorite-expand-button" type="button" aria-expanded="false" hidden>더 보기</button>
      </section>

      <section class="toolbar" aria-label="편성표 필터">
        <div id="day-filters" class="filter-group" aria-label="요일"></div>
        <div class="toolbar-options">
          <label class="rerun-filter">
            <input id="hide-reruns" type="checkbox">
            <span>재방송 숨기기</span>
          </label>
          <div id="view-filters" class="filter-group" aria-label="표시 범위"></div>
          <div class="select-filters">
            <details id="genre-picker" class="filter-picker">
              <summary id="genre-picker-summary" class="filter-picker-summary">전체 장르</summary>
              <div class="filter-picker-panel">
                <div class="filter-picker-actions">
                  <button id="select-all-genres" type="button">전체 선택</button>
                  <button id="clear-genre-selection" type="button">전체 해제</button>
                </div>
                <div id="genre-options" class="filter-picker-options"></div>
              </div>
            </details>
            <details id="channel-picker" class="filter-picker">
              <summary id="channel-picker-summary" class="filter-picker-summary">전체 채널</summary>
              <div class="filter-picker-panel">
                <div class="filter-picker-actions">
                  <button id="select-all-channels" type="button">전체 선택</button>
                  <button id="clear-channel-selection" type="button">전체 해제</button>
                </div>
                <div id="channel-options" class="filter-picker-options"></div>
              </div>
            </details>
          </div>
        </div>
      </section>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <section id="schedule" class="schedule" aria-label="방송 편성표"></section>

      <footer>
        <p>수동으로 가져온 오늘 편성은 자동 갱신 시각과 비교해 더 최신일 때 이 브라우저에서 우선 표시합니다.</p>
      </footer>
    </main>
  </body>
</html>
